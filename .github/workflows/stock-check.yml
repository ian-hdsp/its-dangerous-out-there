name: Zelda Switch 2 stock check

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; runs are often a few minutes late
  workflow_dispatch:         # "Run workflow" button for manual tests

concurrency:
  group: stock-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Last run's statuses, so pushes go out only when a status changes. Cache keys are
      # immutable, so each run saves under its own key and restores the newest by prefix.
      - name: Restore last status
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stock-state-

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_ON_UNKNOWN: ${{ vars.NOTIFY_ON_UNKNOWN }}
          DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}  # verbose log on manual runs
        run: python check_stock.py

      - name: Save status
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stock-state-${{ github.run_id }}-${{ github.run_attempt }}
