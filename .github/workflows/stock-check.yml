name: Zelda Switch 2 stock check

on:
  schedule:
    - cron: "*/5 * * * *"   # GitHub's minimum; runs are often a few minutes late
  workflow_dispatch:         # "Run workflow" button for manual tests

concurrency:
  group: stock-check
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check:
    # Runs on a self-hosted runner on a home computer (residential IP); Target refuses
    # GitHub's data-center IPs (HTTP 435). Jobs wait in the queue while that computer is off.
    runs-on: self-hosted
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # pip and Playwright keep their downloads on the runner's disk, so after the
      # first run these are quick no-ops.
      - name: Install
        run: |
          python -m pip install -q -r requirements.txt
          python -m playwright install chromium

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          NOTIFY_ON_UNKNOWN: ${{ vars.NOTIFY_ON_UNKNOWN }}
          DEBUG: ${{ github.event_name == 'workflow_dispatch' && '1' || '' }}  # verbose log on manual runs
        run: python check_stock.py
