name: Zelda Switch 2 stock check

on:
  schedule:
    - cron: "*/5 * * * *"   # keeps a run queued; each run itself checks every minute (see LOOP_MINUTES)
  workflow_dispatch:         # "Run workflow" button for manual tests
    inputs:
      loop_minutes:
        description: "Minutes to keep checking every 60 s (0 = check once)"
        default: "0"
      send_test_push:
        description: "Send one [TEST] push in the IN STOCK format (checks GitHub -> ntfy -> phone)"
        type: boolean
        default: false
      mode:
        description: "test = pushes labelled [TEST], separate state; live = behaves like a scheduled run"
        type: choice
        options: [test, live]
        default: test

# Live runs (scheduled, or manual with mode=live) queue one at a time; test runs use their
# own queue, so a test never displaces the live run waiting to take over.
concurrency:
  group: stock-check-${{ (github.event_name == 'schedule' || inputs.mode == 'live') && 'live' || 'test' }}
  cancel-in-progress: false

permissions:
  contents: write   # live runs commit new rows to drops.csv (the drop log)

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 58   # scheduled runs loop for 50 min; the queued next run starts as this one ends
    env:
      # Scheduled runs, or manual runs with mode=live, are real; other manual runs are tests.
      LIVE: ${{ github.event_name == 'schedule' || inputs.mode == 'live' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}

      - name: Install
        run: |
          pip install -r requirements.txt
          python -m playwright install --with-deps chromium

      # Last run's statuses, so pushes go out only when a status changes. Cache keys are
      # immutable, so each run saves under its own key and restores the newest by prefix.
      # Manual (test) runs keep separate state ("test") so they never affect real alerts.
      - name: Restore last status
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: stock-state-${{ env.LIVE == 'true' && 'live' || 'test' }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: stock-state-${{ env.LIVE == 'true' && 'live' || 'test' }}-

      - name: Check stock
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          PUSHOVER_USER: ${{ secrets.PUSHOVER_USER }}     # optional second channel
          PUSHOVER_TOKEN: ${{ secrets.PUSHOVER_TOKEN }}
          NOTIFY_ON_UNKNOWN: ${{ vars.NOTIFY_ON_UNKNOWN }}
          DEBUG: ${{ env.LIVE != 'true' && '1' || '' }}  # verbose log on test runs
          # Scheduled runs: check every CHECK_INTERVAL s for 50 min. Manual runs: one check.
          LOOP_MINUTES: ${{ github.event_name == 'schedule' && '50' || inputs.loop_minutes || '0' }}
          CHECK_INTERVAL: "60"
          TEST_RUN: ${{ env.LIVE != 'true' && '1' || '' }}  # label pushes "[TEST]"
          SEND_TEST_PUSH: ${{ env.LIVE != 'true' && inputs.send_test_push && '1' || '' }}
          DROP_LOG: ${{ env.LIVE == 'true' && 'drops.csv' || '' }}  # test runs never log drops
        run: python check_stock.py

      - name: Save status
        if: always() && hashFiles('state.json') != ''
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: stock-state-${{ env.LIVE == 'true' && 'live' || 'test' }}-${{ github.run_id }}-${{ github.run_attempt }}

      # Live runs: commit any drops that finished during this run. Keeps a permanent log, and
      # the commits also stop GitHub disabling the schedule after 60 days without activity.
      - name: Commit drop log
        if: always() && env.LIVE == 'true'
        run: |
          if [ -z "$(git status --porcelain -- drops.csv)" ]; then echo "no new drops"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add drops.csv
          git commit -m "chore: log Nintendo drop(s) [skip ci]"
          for i in 1 2 3; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep 5
          done
          echo "::warning::could not push drops.csv"
